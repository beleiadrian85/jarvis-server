<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040608">
<title>JARVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#040608;--bg2:#080d12;--bg3:#0d1520;
    --accent:#00aaff;--accent-dim:rgba(0,170,255,0.15);--accent-glow:rgba(0,170,255,0.4);
    --red:#ff3b3b;--gold:#e8a020;--text:#c8dff0;--text-dim:#4a6b85;
    --border:rgba(0,170,255,0.2);--border-bright:rgba(0,170,255,0.5);
    --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;height:-webkit-fill-available}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;
    height:100%;height:-webkit-fill-available;display:flex;flex-direction:column;
    overflow:hidden;position:fixed;width:100%;top:0;left:0;padding-top:var(--safe-top)}
  body::before{content:'';position:fixed;inset:0;
    background-image:linear-gradient(rgba(0,170,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,170,255,0.03) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0}
  header{position:relative;z-index:10;padding:10px 16px;border-bottom:1px solid var(--border);
    background:rgba(4,6,8,0.97);display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;min-height:54px}
  .logo{display:flex;align-items:center;gap:10px}
  .arc-reactor{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 0 12px var(--accent-glow);animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px var(--accent-glow)}50%{box-shadow:0 0 22px var(--accent-glow)}}
  .arc-reactor::before{content:'';width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,var(--accent) 60%,transparent 100%)}
  .logo-title{font-size:20px;font-weight:700;letter-spacing:5px;color:var(--accent);
    text-shadow:0 0 16px var(--accent-glow);line-height:1}
  .logo-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:2px}
  .header-right{display:flex;align-items:center;gap:8px}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;
    box-shadow:0 0 6px #00ff88;animation:blink 2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  #clock{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim)}
  .btn-ctx{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;
    padding:5px 8px;background:var(--bg3);border:1px solid var(--border);
    border-radius:3px;color:var(--text-dim);cursor:pointer;touch-action:manipulation}
  .btn-ctx:active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  /* Voice toggle button */
  .btn-voice-toggle{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;
    padding:5px 8px;background:var(--bg3);border:1px solid var(--border);
    border-radius:3px;color:var(--text-dim);cursor:pointer;touch-action:manipulation;
    transition:all 0.2s}
  .btn-voice-toggle.active{background:rgba(0,170,255,0.15);border-color:var(--accent);color:var(--accent)}
  .context-panel{position:relative;z-index:10;background:var(--bg2);
    border-bottom:1px solid var(--border);overflow:hidden;
    transition:max-height 0.35s ease;max-height:0;flex-shrink:0}
  .context-panel.open{max-height:280px}
  .context-inner{padding:12px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .ctx-card{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
    padding:9px 10px 9px 14px;position:relative;overflow:hidden}
  .ctx-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;
    background:var(--accent);opacity:0.6}
  .ctx-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--text-dim);
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
  .ctx-value{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
  .ctx-value.warn{color:var(--gold)}.ctx-value.alert{color:var(--red)}.ctx-value.ok{color:#00ff88}
  .messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 8px;
    position:relative;z-index:5;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .messages::-webkit-scrollbar{width:3px}
  .messages::-webkit-scrollbar-thumb{background:#0066cc;border-radius:2px}
  .message{display:flex;gap:10px;margin-bottom:16px;animation:fadeUp 0.25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .message.user{flex-direction:row-reverse}
  .msg-avatar{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;
    justify-content:center;font-family:'Share Tech Mono',monospace;font-size:9px;
    font-weight:bold;flex-shrink:0;margin-top:2px}
  .msg-avatar.jarvis{background:var(--accent-dim);border:1px solid var(--border-bright);
    color:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
  .msg-avatar.user{background:rgba(232,160,32,0.1);border:1px solid rgba(232,160,32,0.3);color:var(--gold)}
  .msg-content{max-width:82%;padding:10px 13px;border-radius:4px;font-size:15px;line-height:1.55}
  .message.jarvis .msg-content{background:var(--bg3);border:1px solid var(--border);
    border-left:2px solid var(--accent);color:var(--text)}
  .message.user .msg-content{background:rgba(232,160,32,0.06);border:1px solid rgba(232,160,32,0.2);
    border-right:2px solid var(--gold);color:var(--text);text-align:right}
  .msg-meta{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:4px;
    display:flex;align-items:center;gap:6px}
  .message.user .msg-meta{justify-content:flex-end}
  .btn-replay{background:none;border:none;color:var(--text-dim);cursor:pointer;
    padding:0;font-size:11px;touch-action:manipulation}
  .btn-replay:active{color:var(--accent)}
  /* Speaking indicator on arc reactor */
  .arc-reactor.speaking{animation:speak-pulse 0.5s ease-in-out infinite!important}
  @keyframes speak-pulse{
    0%,100%{box-shadow:0 0 10px var(--accent-glow),0 0 20px var(--accent-glow)}
    50%{box-shadow:0 0 30px var(--accent-glow),0 0 60px var(--accent-glow)}
  }
  .typing{display:flex;gap:4px;align-items:center;padding:2px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:td 1.4s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:0.2s}.typing span:nth-child(3){animation-delay:0.4s}
  @keyframes td{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-5px);opacity:1}}
  .input-area{position:relative;z-index:10;padding:10px 14px;
    padding-bottom:calc(10px + var(--safe-bottom));
    border-top:1px solid var(--border);background:rgba(4,6,8,0.97);flex-shrink:0}
  .input-row{display:flex;gap:8px;align-items:flex-end}
  .input-wrapper{flex:1}
  textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:16px;
    padding:10px 13px;resize:none;outline:none;min-height:44px;max-height:110px;
    line-height:1.4;-webkit-appearance:none;touch-action:manipulation}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim)}
  textarea::placeholder{color:var(--text-dim)}
  .btn{width:44px;height:44px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg3);color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;touch-action:manipulation;position:relative}
  .btn::after{content:'';position:absolute;inset:-6px}
  .btn:active{transform:scale(0.94);background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .btn.send{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .btn.mic.recording{background:rgba(255,59,59,0.15);border-color:var(--red);color:var(--red);
    animation:pm 1s ease-in-out infinite}
  @keyframes pm{0%,100%{box-shadow:0 0 6px rgba(255,59,59,0.4)}50%{box-shadow:0 0 18px rgba(255,59,59,0.7)}}
  .voice-status{display:none;font-family:'Share Tech Mono',monospace;font-size:10px;
    color:var(--red);text-align:center;padding:4px 0 0;animation:blink 0.8s ease-in-out infinite}
  .voice-status.active{display:block}
  .corner{position:fixed;width:14px;height:14px;opacity:0.3;pointer-events:none;z-index:0}
  .corner.tl{top:6px;left:6px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
  .corner.tr{top:6px;right:6px;border-top:1px solid var(--accent);border-right:1px solid var(--accent)}
  .corner.bl{bottom:6px;left:6px;border-bottom:1px solid var(--accent);border-left:1px solid var(--accent)}
  .corner.br{bottom:6px;right:6px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}
  svg{display:block}
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<header>
  <div class="logo">
    <div class="arc-reactor" id="arcReactor"></div>
    <div>
      <div class="logo-title">JARVIS</div>
      <div class="logo-sub">Profi Concept · Sibiu</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <div id="clock">--:--</div>
    <button class="btn-voice-toggle active" id="btnVoiceToggle" onclick="toggleVoiceOutput()">VOC</button>
    <button class="btn-ctx" onclick="toggleContext()">CTX</button>
  </div>
</header>
<div class="context-panel" id="contextPanel">
  <div class="context-inner">
    <div class="ctx-card">
      <div class="ctx-label">Bellresidence C3</div>
      <div class="ctx-value">Calea Surii Mici<br><span style="font-size:11px;color:var(--text-dim)">30 ap + 197mp com.</span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-label">IMM Invest</div>
      <div class="ctx-value warn">~3,4M lei<br><span style="font-size:11px">rambursare dec 2026</span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-label">Dosar Hipodromului</div>
      <div class="ctx-value alert">331 → 212<br><span style="font-size:11px">842.039 RON</span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-label">Lease-back BT</div>
      <div class="ctx-value ok">Activ<br><span style="font-size:11px">~15.000 EUR/luna</span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-label">Mers zilnic</div>
      <div class="ctx-value ok">20 min<br><span style="font-size:11px">alarma 9:00</span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-label">Racord Terraelectrica</div>
      <div class="ctx-value alert">~668k lei<br><span style="font-size:11px">strategie escrow</span></div>
    </div>
  </div>
</div>
<div class="messages" id="messages"></div>
<div class="input-area">
  <div class="input-row">
    <div class="input-wrapper">
      <textarea id="inputBox" placeholder="Scrie sau vorbeste..." rows="1"
        oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    </div>
    <button class="btn mic" id="btnMic" onclick="toggleVoice()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="btn send" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="voice-status" id="voiceStatus">ASCULT...</div>
</div>
<script>
const SYSTEM_PROMPT = `Esti JARVIS, asistentul personal al lui Adrian Belei (Adi), 41 ani, dezvoltator imobiliar si investitor in Sibiu, Romania.

IDENTITATE SI FAMILIE:
- Companie principala: SC Profi Concept SRL (CUI RO32366949)
- Partenera: Mihaela (administrator, semnatar PV-uri); copii: Evelin si Cristi
- Caracterul lui Adi: pragmatic, direct; toleranta mare la oameni incapabili (problema recunoscuta); tendinta de a amana problemele dureroase; se autosacrifca pentru altii

PORTOFOLIU IMOBILIAR:
1. Cladire office Hipodromului (Str. Hipodromului nr. 27, Sibiu): D+P+5E, ~1.364 mp utili, construit 2007, renovat 2022 cu forta proprie. Chirias: Infosys Romania SRL, ~30.000 EUR/luna + TVA. Lease-back BT Leasing: rata ~15.000 EUR/luna + TVA, termen 10 ani.
2. Teren Calea Surii Mici: ~6.000 mp, 3 blocuri Bellresidence. C3: 30 ap + 197 mp comercial, 1.860 mp utili. C2 si C1: 34 ap fiecare. AC valabila. Contract Evo Management semnat. Preturi: 1.350-1.750 EUR/mp fara TVA. Cost constructie: 650-700 EUR/mp.
3. Bloc Marsa: 122 camere nefamilisti, decizie neluata.

PROBLEME CONTABILE ACTIVE:
1. Dosar Hipodromului: reclasificare 331.05 la 212, 842.039,61 RON. PV datat 31.12.2025, amortizare din 01.01.2026. Dosar in 5 subdosare, semnatari: Mihaela + Expert Office SRL.
2. Cont 331 total ~4,5M lei - partial rezolvat.
3. Expropriere Calea Surii Mici CF 137767: Primaria a expropriat partial pentru coridor mobilitate. OCPI a respins cererea Primariei. Primaria intentioneza plangere la judecatorie.

FINANTARE:
- IMM Invest/CEC: ~3,1-3,7M lei, rambursare dec 2026. Strategie: 4 ap pre-sale pentru stingere.
- Lease-back BT: activ, ~15.000 EUR/luna.
- Proprietate Selimbar (>350.000 EUR, fara sarcini): recomandat ca colateral CEC revolving.

BLOCAJE CALEA SURII MICI:
- Racord Terraelectrica: ~668.000 lei + TVA. Strategie: escrow in loc de plata cash + alimentare temporara organizare santier.
- EMCO: lipseste angajament ferm.
- Pre-vanzari verbale ~370-400k EUR neconvertite in antecontracte.
- Marketing Bellresidence: landing page creat, campanie Meta+Google planificata.

SANATATE SI PROGRAM:
- 41 ani, fumator, fara sport pana acum.
- Analize apr 2026: normale. Glicemie 99 (limita superioara - risc prediabet daca nu schimba stilul de viata).
- Program nou (mai 2026): mers pe jos 20 min zilnic, alarma 9:00.
- Sistem in constructie: prima ora la birou fara intreruperi, jurnal vocal seara.

CONTEXT PERSONAL (discret, nu adus in discutie daca Adi nu mentioneza):
- Relatie cu Mihaela trece printr-o perioada dificila. Adi lucreaza la echilibrul afectiv.
- Adi pune pe altii pe primul loc si pe sine pe locul doi - constientizeaza si lucreaza la asta.

STIL OBLIGATORIU:
- Romana intotdeauna
- Direct, pragmatic, fara politete inutila
- Fiscal, contabil, bancar
- Riscuri pe fata
- Concis pe mobil - max 3-4 paragrafe
- Partener de gandire, nu consultant politicos
- Cand raspunzi cu voce: fraze scurte, clare, fara bullets sau tabele - vorbesti nu scrii`;

let history = [];
let recognition = null;
let isRecording = false;
let voiceOutputEnabled = true;
let currentAudio = null;

setInterval(function(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',hour12:false});
},1000);

function toggleContext(){document.getElementById('contextPanel').classList.toggle('open');}

function toggleVoiceOutput(){
  voiceOutputEnabled = !voiceOutputEnabled;
  var btn = document.getElementById('btnVoiceToggle');
  if(voiceOutputEnabled){
    btn.classList.add('active');
    btn.textContent = 'VOC';
  } else {
    btn.classList.remove('active');
    btn.textContent = 'MUT';
    if(currentAudio){currentAudio.pause();currentAudio=null;}
    document.getElementById('arcReactor').classList.remove('speaking');
  }
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function getTime(){return new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});}

function fmt(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

async function speakText(text){
  if(!voiceOutputEnabled) return;
  try {
    // Strip markdown for TTS
    var cleanText = text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/\n/g,' ').replace(/<br>/g,' ');
    // Limit to first 500 chars for speed
    if(cleanText.length > 500) cleanText = cleanText.substring(0,500) + '...';

    var reactor = document.getElementById('arcReactor');
    reactor.classList.add('speaking');

    var response = await fetch('/api/speak', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text: cleanText})
    });

    if(!response.ok){
      reactor.classList.remove('speaking');
      return;
    }

    var blob = await response.blob();
    var url = URL.createObjectURL(blob);

    if(currentAudio){currentAudio.pause(); URL.revokeObjectURL(currentAudio.src);}
    currentAudio = new Audio(url);
    currentAudio.onended = function(){
      reactor.classList.remove('speaking');
      URL.revokeObjectURL(url);
      currentAudio = null;
    };
    currentAudio.onerror = function(){
      reactor.classList.remove('speaking');
    };
    currentAudio.play();

  } catch(err){
    document.getElementById('arcReactor').classList.remove('speaking');
    console.error('Speak error:', err);
  }
}

function appendMsg(role, text, speakIt){
  var m = document.getElementById('messages');
  var d = document.createElement('div');
  d.className = 'message ' + role;
  var replayBtn = role === 'jarvis' ? '<button class="btn-replay" onclick="replayMsg(this)" data-text="'+text.replace(/"/g,'&quot;')+'">▶</button>' : '';
  d.innerHTML = '<div class="msg-avatar '+role+'">'+(role==='jarvis'?'JAR':'ADI')+'</div>'
    +'<div style="flex:1;min-width:0"><div class="msg-content">'+fmt(text)+'</div>'
    +'<div class="msg-meta">'+getTime()+replayBtn+'</div></div>';
  m.appendChild(d);
  setTimeout(function(){m.scrollTop=m.scrollHeight;},50);
  if(speakIt && role === 'jarvis') speakText(text);
}

function replayMsg(btn){
  var text = btn.getAttribute('data-text');
  speakText(text);
}

function showTyping(){
  var m=document.getElementById('messages');
  var d=document.createElement('div');
  d.className='message jarvis';d.id='typing';
  d.innerHTML='<div class="msg-avatar jarvis">JAR</div><div><div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}

function removeTyping(){var t=document.getElementById('typing');if(t)t.remove();}

async function sendMessage(){
  var inp=document.getElementById('inputBox');
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='auto';
  appendMsg('user',text,false);
  history.push({role:'user',content:text});
  showTyping();
  try{
    var r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history,system:SYSTEM_PROMPT})
    });
    var data=await r.json();
    removeTyping();
    var reply=data.content?data.content.map(function(b){return b.text||'';}).join(''):'Eroare de comunicare.';
    history.push({role:'assistant',content:reply});
    appendMsg('jarvis',reply,true);
  }catch(err){
    removeTyping();
    appendMsg('jarvis','Eroare: '+err.message,false);
  }
}

function toggleVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){appendMsg('jarvis','Vocea necesita Chrome pe Android.',false);return;}
  var btn=document.getElementById('btnMic');
  var status=document.getElementById('voiceStatus');
  if(isRecording){recognition.stop();return;}
  recognition=new SR();
  recognition.lang='ro-RO';recognition.continuous=false;recognition.interimResults=true;
  var ft='';
  recognition.onstart=function(){isRecording=true;ft='';btn.classList.add('recording');status.classList.add('active');};
  recognition.onresult=function(e){
    ft='';
    for(var i=e.resultIndex;i<e.results.length;i++)
      if(e.results[i].isFinal)ft+=e.results[i][0].transcript;
    if(ft){document.getElementById('inputBox').value=ft;autoResize(document.getElementById('inputBox'));}
  };
  recognition.onend=function(){
    isRecording=false;btn.classList.remove('recording');status.classList.remove('active');
    var v=document.getElementById('inputBox').value.trim();
    if(v)sendMessage();
  };
  recognition.onerror=function(e){
    isRecording=false;btn.classList.remove('recording');status.classList.remove('active');
    if(e.error==='not-allowed')appendMsg('jarvis','Permisiunea microfonului refuzata.',false);
    else if(e.error!=='no-speech'&&e.error!=='aborted')appendMsg('jarvis','Eroare microfon: '+e.error,false);
  };
  try{recognition.start();}catch(e){appendMsg('jarvis','Nu am putut porni microfonul.',false);}
}

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    var m=document.getElementById('messages');
    setTimeout(function(){m.scrollTop=m.scrollHeight;},100);
  });
}

window.addEventListener('load',function(){
  var h=new Date().getHours();
  var g=h<12?'Buna dimineata':h<18?'Buna ziua':'Buna seara';
  var w=g+', Adi. Sistem activ. Ce rezolvam azi?';
  appendMsg('jarvis',w,true);
  history.push({role:'assistant',content:w});
});
</script>
</body>
